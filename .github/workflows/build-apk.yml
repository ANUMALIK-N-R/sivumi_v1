name: Build Sivumi Offline APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Verify Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          echo "Android API 36 is ready."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install web dependencies
        run: bun install

      - name: Type-check web application
        run: bun run lint

      - name: Build web application
        run: bun run build

      - name: Copy web assets into Android
        run: bun run android:assets

      - name: Verify Android web assets
        run: |
          test -f android/app/src/main/assets/www/index.html

          JS_COUNT=$(find \
            android/app/src/main/assets/www/assets \
            -type f \
            -name "*.js" \
            | wc -l)

          test "$JS_COUNT" -gt 0

          echo "Bundled JavaScript files: $JS_COUNT"

      - name: Build Android APK
        run: |
          gradle \
            --no-daemon \
            --non-interactive \
            -p android \
            assembleDebug

      - name: Copy APK to requested locations
        run: |
          mkdir -p .build-outputs
          mkdir -p APK_DOWNLOAD

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            .build-outputs/app-debug.apk

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            APK_DOWNLOAD/app-debug.apk

          cmp \
            .build-outputs/app-debug.apk \
            APK_DOWNLOAD/app-debug.apk

      - name: Verify APK
        run: |
          APK="APK_DOWNLOAD/app-debug.apk"

          test -s "$APK"

          unzip -t "$APK" >/dev/null

          unzip -l "$APK" \
            | grep "AndroidManifest.xml"

          unzip -l "$APK" \
            | grep -E "classes([0-9]*)?\.dex"

          unzip -l "$APK" \
            | grep "assets/www/index.html"

          unzip -l "$APK" \
            | grep -E "assets/www/assets/.*\.js"

          "$ANDROID_HOME/build-tools/36.0.0/aapt2" \
            dump badging \
            "$APK"

          ls -lh "$APK"

          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sivumi-Offline-Tracker-APK
          path: APK_DOWNLOAD/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create project ZIP containing APK
        run: |
          zip -r \
            sivumi-offline-tracker-with-apk.zip \
            . \
            -x ".git/*" \
            -x "node_modules/*" \
            -x "sivumi-offline-tracker-with-apk.zip"

      - name: Upload complete project
        uses: actions/upload-artifact@v4
        with:
          name: Sivumi-Offline-Tracker-Complete-Project
          path: sivumi-offline-tracker-with-apk.zip
          if-no-files-found: error
          retention-days: 30
